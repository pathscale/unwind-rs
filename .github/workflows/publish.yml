name: Publish

# House scheme: the version in Cargo.toml is the release, published only when crates.io lacks it.
# Manual only; releases are normally published locally after the merge.
on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubicloud-standard-2
    steps:
      - name: Require the master branch
        run: test "$GITHUB_REF" = refs/heads/master

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Check the registry token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty: gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/unwind-rs"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: cargo build --release

      - name: Publish a missing version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "unwind-rs") | .version')
          if cargo info --registry crates-io "unwind-rs@$version" > /dev/null 2>&1; then
            echo "unwind-rs $version is already on crates.io"
          else
            cargo publish --registry crates-io
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
